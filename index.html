<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f6f43">
<title>제주시농협 행사 체크리스트</title>
<style>
  :root{--g:#1f6f43;--g2:#2f8f5a;--g-bg:#eaf5ee;--ink:#1c2420;--mute:#6b7a72;--line:#dfe6e2;--bg:#f6f8f7;--card:#fff;--warn:#b4570a;--warn-bg:#fff3e3;--red:#b3261e;--red-bg:#fdecea}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding-bottom:90px}
  header{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:856px;margin:0 auto}
  .back{appearance:none;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:8px;width:34px;height:34px;font-size:18px;cursor:pointer;display:none}
  h1{font-size:16px;margin:0;flex:1 1 180px;line-height:1.3;min-width:0}
  h1 small{display:block;font-weight:400;opacity:.8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .auth{display:flex;align-items:center;gap:8px;font-size:13px}
  .btn{appearance:none;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--g)}
  .btn.ghost{background:rgba(255,255,255,.16);color:#fff}
  .btn.line{background:#fff;color:var(--g);border:1px solid var(--line)}
  .btn.pri{background:var(--g);color:#fff}
  .btn.danger{background:var(--red);color:#fff}
  .btn.dl{background:#fff;color:var(--red);border:1px solid #efc4c0}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn[disabled]{opacity:.5;cursor:default}
  .badge{display:inline-block;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:700;background:#fff;color:var(--g)}
  .badge.ro{background:var(--warn-bg);color:var(--warn)}
  .pill{font-size:11px;border-radius:99px;padding:2px 8px;background:rgba(255,255,255,.18);white-space:nowrap}
  .total{max-width:856px;margin:8px auto 0;display:none;align-items:center;gap:10px;font-size:13px}
  .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
  .bar>i{display:block;height:100%;background:#fff;width:0;transition:width .25s}
  main{max-width:880px;margin:0 auto;padding:12px}
  .notice{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;background:var(--warn-bg);color:#6b3a07;border:1px solid #f1d3a8}
  .notice.red{background:var(--red-bg);color:#7a1b15;border-color:#f1c2bd}
  .notice .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
  .tab{appearance:none;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;font-weight:600;color:var(--mute);cursor:pointer}
  .tab.on{background:var(--g);border-color:var(--g);color:#fff}
  .tabs .sp{flex:1}
  .cards{display:grid;gap:10px}
  @media (min-width:720px){.cards{grid-template-columns:repeat(2,1fr)}}
  @media (min-width:720px){main{padding:16px 12px}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer}
  .card:active{background:var(--g-bg)}
  .c-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .c-top h3{margin:0;font-size:16px;flex:1 1 auto}
  .c-date{font-size:12.5px;color:var(--mute)}
  .card .bar{background:var(--line);margin:10px 0 6px}
  .card .bar>i{background:var(--g2)}
  .c-meta{font-size:12.5px;color:var(--mute)}
  .c-act{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
  .srow .si{flex:1 1 100%;min-width:0}
  .srow .sa{flex:1 1 100%;display:flex;gap:6px;justify-content:flex-end}
  .srow .si b{font-size:14px;margin-right:5px}
  .srow .si .badge{background:var(--bg);margin-right:4px}
  .srow .se{font-size:12px;color:var(--mute);overflow-wrap:anywhere}
  #sList{max-height:42vh;overflow:auto;margin-bottom:10px}
  .sadd{border-top:2px solid var(--line);padding-top:12px}
  .sadd input[type=text]{width:100%;margin-bottom:7px;font:inherit;font-size:15px;padding:9px 10px;border:1px solid #c9d4ce;border-radius:9px;background:#fff;color:var(--ink)}
  .sadd input[type=checkbox]{width:18px;height:18px}
  .sadd label.chk{display:flex;gap:7px;align-items:center;font-size:13px;margin:2px 0 10px}
  .r-tools{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:10px 0}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;background:#fff}
  .seg-b{border:0;background:none;padding:6px 13px;font:inherit;font-size:13px;color:var(--mute);cursor:pointer}
  .seg-b.on{background:var(--g);color:#fff;font-weight:700}
  .rr{display:flex;gap:8px;align-items:flex-start;padding:10px 14px;border-bottom:1px solid var(--line)}
  .rr:last-child{border-bottom:0}
  .rr-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .rr-task{font-size:15px;font-weight:600;overflow-wrap:anywhere}
  .rr-with{font-size:12.5px;color:var(--g)}
  .rr-who{align-self:flex-start;background:var(--bg);color:var(--g);border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700}
  .rr-when,.rr-note{font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
  .rr .ctl{display:flex;gap:4px}
  #tpList{max-height:52vh;overflow:auto;margin-bottom:10px}
  .btn.pri.sm{background:var(--g);color:#fff;border:0}
  .empty{padding:28px 14px;color:var(--mute);font-size:14px;text-align:center}
  .tools{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;margin:4px 0 8px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tools::-webkit-scrollbar{display:none}
  .tools .btn{flex:0 0 auto;white-space:nowrap}
  .stick{position:sticky;top:var(--hh,0px);z-index:15;background:var(--bg);padding-top:6px;margin:0 -12px 6px;padding-left:12px;padding-right:12px;box-shadow:0 6px 8px -6px rgba(0,0,0,.18)}
  .stick .pmemo{margin-bottom:8px;padding:8px 10px}
  .stick .pm-n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;padding-top:4px}
  .stick .pm-n div{display:inline}
  .stick .tabs{margin-bottom:6px;flex-wrap:nowrap;overflow-x:auto}
  .stick .tab{flex:0 0 auto}
  section.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .sec-h{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none;background:var(--g-bg)}
  .sec-h h2{font-size:16px;margin:0;flex:1;min-width:0}
  .sec-h h2 span{font-weight:500;color:var(--mute);font-size:13px;margin-left:6px}
  .cnt{font-size:12.5px;font-weight:700;color:var(--g);white-space:nowrap}
  .chev{transition:transform .2s;color:var(--mute)}
  .sec.closed .chev{transform:rotate(-90deg)}
  .sec.closed .sec-b{display:none}
  .sec-bar{height:3px;background:var(--line)}
  .sec-bar>i{display:block;height:100%;background:var(--g2);width:0;transition:width .25s}
  .sec-note{margin:0;padding:10px 14px 4px;color:var(--mute);font-size:13.5px}
  .grp{display:flex;align-items:center;gap:6px;padding:6px 14px 2px;font-size:12.5px;font-weight:800;color:var(--g);letter-spacing:.02em}
  .grp .nm{flex:1}
  ul{list-style:none;margin:0;padding:0 6px 8px}
  li.item label{display:flex;gap:12px;align-items:flex-start;padding:10px 8px;cursor:pointer}
  li.item input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:24px;height:24px;margin:1px 0 0;border:2px solid #b7c4bd;border-radius:7px;background:#fff;display:grid;place-content:center;cursor:pointer}
  li.item input:checked{background:var(--g2);border-color:var(--g2)}
  li.item input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
  li.item.done .t{color:var(--mute);text-decoration:line-through;text-decoration-color:#b7c4bd}
  li.item.lock label,li.item.lock input{cursor:default}
  li.item:active{background:var(--g-bg)}
  li.item.edit{display:flex;gap:8px;align-items:flex-start;padding:8px;border-bottom:1px dashed var(--line)}
  .txt{flex:1;word-break:keep-all}
  .sup{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
  .sup b{color:var(--ink)}
  .meta{display:block;font-size:12px;color:var(--g);margin-top:2px;text-decoration:none}
  .ctl{display:flex;gap:4px;flex:0 0 auto}
  .ib{appearance:none;border:1px solid var(--line);background:#fff;border-radius:7px;min-width:30px;height:30px;font-size:13px;cursor:pointer;color:var(--ink);padding:0 6px}
  .ib.del{color:var(--red)}
  .add-row{padding:4px 14px 12px;display:flex;gap:8px;flex-wrap:wrap}
  li.item:not(.edit){display:flex;align-items:flex-start}
  li.item:not(.edit) label{flex:1;min-width:0}
  .note-btn{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:2px 8px;font:inherit;font-size:12px;margin:8px 4px 0 0;color:var(--mute);cursor:pointer}
  .note-btn.has{color:var(--g);border-color:var(--g2);background:var(--g-bg);font-weight:700}
  .memo{display:block;font-size:12.5px;color:#7a5a12;background:#fff8e1;border-radius:6px;padding:2px 7px;margin-top:3px;width:fit-content;max-width:100%}
  .memo b{color:#5c4308}
  .pmemo{background:#fff8e1;border:1px solid #f1e0a6;border-radius:12px;padding:10px 12px;margin-bottom:12px}
  .pm-h{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#5c4308}
  .pm-n{font-size:13.5px;margin-top:6px;color:#4a3a0b;border-top:1px dashed #ecd98f;padding-top:6px}
  .pm-n span{color:#8a7a45;font-size:12px;margin-left:4px}
  .pm-n div{white-space:pre-wrap;word-break:break-word;margin-top:1px}
  .nt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#fff}
  .nt-h{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--mute)}
  .nt-h b{color:var(--ink);font-size:13.5px}
  .nt-b{white-space:pre-wrap;word-break:break-word;margin-top:2px;font-size:14.5px}
  .nt-a{display:flex;gap:6px;margin-top:6px}
  #nList{max-height:42vh;overflow:auto;margin-bottom:8px}
  #nText{width:100%;min-height:78px;font:inherit;font-size:15px;padding:9px 10px;border:1px solid #c9d4ce;border-radius:9px;resize:vertical}
  dialog{border:0;border-radius:16px;padding:0;width:min(94vw,460px);box-shadow:0 10px 40px rgba(0,0,0,.3);color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog form{padding:18px}
  dialog h3{margin:0 0 10px;font-size:17px}
  .dlg-msg{margin:0 0 10px;font-size:14px;color:var(--mute);white-space:pre-line}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:4px}
  .fld input,.fld textarea,.fld select{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid #c9d4ce;border-radius:9px;background:#fff;color:var(--ink)}
  .fld textarea{min-height:130px;resize:vertical}
  .chkf{display:flex;flex-wrap:wrap;gap:6px;max-height:34vh;overflow:auto}
  .chkf label{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:14px;font-weight:600;color:var(--ink);border:1px solid #c9d4ce;border-radius:99px;padding:6px 12px;cursor:pointer;background:#fff}
  .chkf label:has(input:checked){background:var(--g-bg);border-color:var(--g2);color:var(--g)}
  .fld .chkf input{width:auto;padding:0;accent-color:var(--g2)}
  .gridf .gh,.gridf .grow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1.25fr) 28px;gap:6px;margin-bottom:6px;align-items:center}
  .gridf .gh span{font-size:12px;font-weight:700;color:var(--mute);padding-left:2px}
  .gridf .grow input{padding:8px 6px;font-size:14.5px;min-width:0;width:100%}
  .gridf .gx{appearance:none;border:1px solid var(--line);background:#fff;border-radius:7px;height:34px;color:var(--red);cursor:pointer;font-size:13px}
  .gridf .gbox{max-height:44vh;overflow:auto;padding-bottom:2px}
  .gridf .gadd{margin-top:2px}
  li.item input.st{cursor:default;opacity:1;margin-top:5px}
  li.item.edit input.st:disabled:checked{background:var(--g2);border-color:var(--g2)}
  li.item.edit .ctl{align-items:center}
  li.item input.item-sel{width:26px;height:26px;border-radius:50%;border:2px solid #4a7fc1;margin:0 4px 0 0;background:#fff}
  li.item input.item-sel:checked{background:#2f6fbd;border-color:#2f6fbd}
  li.item input.item-sel:checked::after{width:5px;height:10px;border-width:0 3px 3px 0}
  .grp .gsel{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);margin-left:8px;cursor:pointer;font-weight:400}
  .grp .gsel input{width:18px;height:18px;accent-color:var(--g2)}
  li.item.edit.picked{background:#e8f0fb}
  #selBar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;background:#1c2420;color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
  #selBar.on{display:block}
  #selBar .in{max-width:880px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #selBar b{flex:1;min-width:90px;font-size:14px}
  #selBar .btn{padding:8px 12px;font-size:14px}
  .fld .hint{font-size:12px;color:var(--mute);margin-top:4px;white-space:pre-line}
  .dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .dlg-actions .btn{padding:10px 16px;font-size:14px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#1c2420;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{max-width:880px;margin:6px auto;padding:0 12px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header>
  <div class="top">
    <button class="back" id="backBtn" aria-label="목록으로">←</button>
    <h1 id="hTitle">행사 체크리스트<small id="hSub">제주시농협</small></h1>
    <div class="auth" id="auth"></div>
  </div>
  <div class="total" id="total">
    <span id="sync" class="pill">연결 중…</span>
    <div class="bar"><i id="totalBar"></i></div>
    <b id="totalTxt">0 / 0</b>
  </div>
</header>

<div id="selBar"><div class="in"><b id="selCnt"></b><button class="btn line" data-act="sel-move">이동</button><button class="btn dl" data-act="sel-del">삭제</button><button class="btn line" data-act="sel-clear">해제</button></div></div>
<main>
  <div id="setup"></div>
  <div id="view"></div>
</main>
<footer>체크·편집은 등록된 직원 Google 계정으로 로그인했을 때만 저장됩니다. 보기는 로그인 없이 가능합니다. <span id="syncFoot" class="pill" style="background:#e5ece8;color:#4f5f57"></span></footer>

<dialog id="dlg">
  <form id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="dlg-actions">
      <button type="button" class="btn line" id="dlgCancel">취소</button>
      <button type="button" class="btn pri" id="dlgOk">확인</button>
    </div>
  </form>
</dialog>
<dialog id="tpdlg">
  <div style="padding:18px">
    <h3>템플릿</h3>
    <p class="dlg-msg" style="margin:0 0 8px">자주 쓰는 구성을 저장해 두고, 새 체크리스트를 만들 때 골라 쓰세요.</p>
    <div id="tpList"></div>
    <div class="dlg-actions" style="flex-wrap:wrap">
      <button type="button" class="btn line" id="tpClose">닫기</button>
      <button type="button" class="btn line" id="tpCsv">📥 CSV 가져오기</button>
      <button type="button" class="btn pri" id="tpNew">＋ 새 템플릿</button>
    </div>
  </div>
</dialog>
<dialog id="sdlg">
  <div style="padding:18px">
    <h3>직원 관리</h3>
    <p class="dlg-msg" style="margin:0 0 8px">여기에 등록된 Google 계정만 체크·편집할 수 있어요.</p>
    <div id="sList"></div>
    <div class="sadd">
      <input type="text" id="sEmail" placeholder="직원 Google 이메일 (예: name@gmail.com)" autocomplete="off" inputmode="email">
      <input type="text" id="sName" placeholder="이름 (예: 홍길동)" autocomplete="off">
      <label class="chk"><input type="checkbox" id="sAdmin"> 관리자 권한 (영구 삭제·직원 관리)</label>
      <div class="dlg-actions">
        <button type="button" class="btn line" id="sClose">닫기</button>
        <button type="button" class="btn pri" id="sAdd">직원 추가</button>
      </div>
    </div>
  </div>
</dialog>
<dialog id="ndlg">
  <div style="padding:18px">
    <h3 id="nTitle"></h3>
    <div id="nList"></div>
    <div id="nForm">
      <textarea id="nText" placeholder="공유할 내용을 적어 주세요 (예: 프린터 용지는 3층 창고에 있어요)"></textarea>
      <div class="dlg-actions">
        <button type="button" class="btn line" id="nClose">닫기</button>
        <button type="button" class="btn line" id="nCancelEdit" style="display:none">수정 취소</button>
        <button type="button" class="btn pri" id="nSave">메모 남기기</button>
      </div>
    </div>
    <div class="dlg-actions" id="nReadOnly" style="display:none"><button type="button" class="btn line" id="nClose2">닫기</button></div>
  </div>
</dialog>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, query, where, doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ===== Firebase 설정: 스탬프 앱과 같은 프로젝트 값을 붙여 넣으세요 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyCwuWD8Zks7PDppvkU1vlCXQlvDFA9_PJs",
  authDomain: "checklist-f6795.firebaseapp.com",
  projectId: "checklist-f6795",
  storageBucket: "checklist-f6795.firebasestorage.app",
  messagingSenderId: "901255037556",
  appId: "1:901255037556:web:55953089f92bcb788ec721"
};
const COL = "checklists";            // 체크리스트 문서 (구조 + 체크 상태)
const TPL_COL = "checklistTemplates"; // 저장된 템플릿 (구조만, 체크 없음)
const STAFF_COL = "checklistStaff";  // 편집 허용 이메일 (문서 ID = 소문자 이메일, admin:true면 영구 삭제 가능)

/* ===== 기본 템플릿: 2026 AX 농업포럼 체험 부스 ===== */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = p => p + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);

const toD = v => (v && v.toDate) ? v.toDate() : (v instanceof Date ? v : null);
const CONFIGURED = !String(firebaseConfig.apiKey).startsWith("YOUR_");

function fmt(ts){
  const d = toD(ts); if(!d) return "";
  const p = new Intl.DateTimeFormat("ko-KR",{timeZone:"Asia/Seoul",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false})
    .formatToParts(d).reduce((o,x)=>(o[x.type]=x.value,o),{});
  return `${p.month}/${p.day} ${p.hour}:${p.minute}`;
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 2800);
}
function buildSections(tpl){
  return tpl.map(s => ({ id:uid("s"), title:s.title, kind:s.kind||"task", date:s.date||"", note:s.note||"",
    groups:s.groups.map(g => ({ id:uid("g"), name:g.name||"", items:g.items.map(t => ({ id:uid("i"), text:t })) })) }));
}
function parseOutline(text){
  const secs = [], roster = []; let sec = null, grp = null, rosterMode = false;
  const newSec = t => {
    if(/^\[(?:분장|roster)\]/.test(t)){ rosterMode = true; sec = null; grp = null; return; }
    rosterMode = false;
    let kind = "task"; const m = t.match(/^\[(?:준비물|supply)\]\s*/);
    if(m){ kind = "supply"; t = t.slice(m[0].length); }
    sec = { id:uid("s"), title:t, kind, date:"", note:"", groups:[] }; secs.push(sec); grp = null;
  };
  const newGrp = n => { if(!sec) newSec("체크리스트"); grp = { id:uid("g"), name:n, items:[] }; sec.groups.push(grp); };
  for(const raw of String(text).split(/\r?\n/)){
    const line = raw.trim(); if(!line) continue;
    if(/^@일정(\s|$)/.test(line)){ if(sec) sec.date = line.replace(/^@일정\s*/, ""); continue; }
    if(/^@안내(\s|$)/.test(line)){ if(sec) sec.note = line.replace(/^@안내\s*/, ""); continue; }
    if(line.startsWith("## ")){ if(!rosterMode) newGrp(line.slice(3).trim()); }
    else if(line.startsWith("# ")) newSec(line.slice(2).trim());
    else {
      const t = line.replace(/^(?:[-*•□☐]|\[[ xX]?\])\s*/, "").trim(); if(!t) continue;
      if(rosterMode){   // # [분장] 아래 줄: 업무 | 담당자 | 시간·장소 | 비고
        const [task, who, when, note] = t.split(t.includes("\t") ? "\t" : "|").map(x => x.trim());
        if(task) roster.push({ task, who:who || "", when:when || "", note:note || "" });
        continue;
      }
      if(!sec) newSec("체크리스트");
      if(!grp) newGrp("");
      if(sec.kind === "supply"){
        const [name, qty, owner] = t.split(t.includes("\t") ? "\t" : "|").map(x => x.trim());
        if(!name) continue;
        grp.items.push({ id:uid("i"), text:name, ...(qty ? { qty } : {}), ...(owner ? { owner } : {}) });
      } else grp.items.push({ id:uid("i"), text:t });
    }
  }
  secs.roster = roster;
  return secs;
}
function stats(l, kind){
  let t = 0, d = 0;
  (l.sections || []).forEach(s => { if(kind && (s.kind || "task") !== kind) return; s.groups.forEach(g => g.items.forEach(i => { t++; if(l.checks?.[i.id]?.checked) d++; })); });
  return { t, d };
}

function openForm({ title, message, fields = [], ok = "확인", danger = false, after }){
  return new Promise(res => {
    const d = $("dlg"); let settled = false;
    $("dlgTitle").textContent = title;
    $("dlgBody").innerHTML = (message ? `<p class="dlg-msg">${esc(message)}</p>` : "") + fields.map((f, i) => {
      const id = "f" + i;
      let inp;
      if(f.type === "textarea") inp = `<textarea id="${id}" placeholder="${esc(f.placeholder||"")}">${esc(f.value||"")}</textarea>`;
      else if(f.type === "checks") inp = `<div id="${id}" class="chkf">${f.options.length ? f.options.map(o => `<label><input type="checkbox" value="${esc(o)}" ${(f.value||[]).includes(o)?"checked":""}><span>${esc(o)}</span></label>`).join("") : `<div class="hint" style="margin:0">등록된 직원이 없어요. 아래에 직접 입력하세요.</div>`}</div>`;
      else if(f.type === "grid") inp = `<div id="${id}" class="gridf">${gridHTML(f)}</div>`;
      else if(f.type === "select") inp = `<select id="${id}">${f.options.map(o => `<option value="${esc(o.value)}" ${o.value===f.value?"selected":""}>${esc(o.label)}</option>`).join("")}</select>`;
      else inp = `<input id="${id}" type="text" value="${esc(f.value||"")}" placeholder="${esc(f.placeholder||"")}" ${f.required?"required":""} autocomplete="off">`;
      return `<div class="fld" data-key="${f.key}"><label for="${id}">${esc(f.label)}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
    }).join("");
    const okBtn = $("dlgOk"); okBtn.textContent = ok; okBtn.className = "btn " + (danger ? "danger" : "pri");
    const finish = v => { if(settled) return; settled = true; if(d.open){ d._skip = true; d.close(); } res(v); };
    const submit = () => {
      const out = {};
      fields.forEach((f, i) => { out[f.key] = f.type === "grid" ? gridRows($("f" + i), f) : f.type === "checks" ? [...$("f" + i).querySelectorAll("input:checked")].map(x => x.value) : $("f" + i).value; });
      finish(out);
    };
    $("dlgOk").onclick = submit;
    $("dlgForm").onsubmit = e => { e.preventDefault(); submit(); };
    $("dlgBody").onkeydown = e => {
      if(e.key === "Enter" && e.target.tagName === "INPUT"){
        e.preventDefault();
        if(e.target.closest(".gridf")) gridEnter(e.target); else submit();
      }
    };
    $("dlgBody").onclick = e => { const g = e.target.closest(".gridf"); if(g) gridClick(g, e.target); };
    $("dlgBody").onpaste = e => { const g = e.target.closest(".gridf"); if(g && e.target.tagName === "INPUT") gridPaste(g, e); };
    $("dlgCancel").onclick = () => finish(null);
    d.onclose = () => { if(d._skip){ d._skip = false; return; } finish(null); };   // 바로 이어서 다시 열 때 이전 창의 닫힘 이벤트는 무시
    d.showModal();
    if(after) after($("dlgBody"));
    const first = $("dlgBody").querySelector("input,textarea,select"); if(first) first.focus();
  });
}

const GCOLS = [{ k:"name", label:"이름", ph:"예) 인화용지" }, { k:"qty", label:"수량", ph:"200장" }, { k:"owner", label:"담당", ph:"김팀장" }];
function gridRowHTML(v = {}){
  return `<div class="grow">${GCOLS.map(c => `<input data-k="${c.k}" type="text" value="${esc(v[c.k] || "")}" placeholder="${esc(c.ph)}" autocomplete="off" ${c.k==="owner"?'list="ownerList"':""} enterkeyhint="next">`).join("")}<button type="button" class="gx" data-gx title="이 줄 지우기">✕</button></div>`;
}
function gridHTML(f){
  const names = [...new Set(staffRows.map(x => String(x.name || "").trim()).filter(Boolean))];
  return `<datalist id="ownerList">${names.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
    <div class="gh">${GCOLS.map(c => `<span>${c.label}</span>`).join("")}<span></span></div>
    <div class="gbox">${gridRowHTML().repeat(f.rows || 4)}</div>
    <button type="button" class="btn line sm gadd" data-gadd>＋ 줄 추가</button>`;
}
function gridRows(g, f){
  return [...g.querySelectorAll(".grow")].map(r => {
    const o = {}; r.querySelectorAll("input").forEach(i => { o[i.dataset.k] = i.value.trim(); }); return o;
  }).filter(o => o.name || o.qty || o.owner);
}
function gridAddRow(g, v){
  const box = g.querySelector(".gbox"); box.insertAdjacentHTML("beforeend", gridRowHTML(v));
  box.scrollTop = box.scrollHeight; return box.lastElementChild;
}
function gridClick(g, t){
  if(t.closest("[data-gadd]")){ gridAddRow(g).querySelector("input").focus(); return; }
  const x = t.closest("[data-gx]");
  if(x){
    const rows = g.querySelectorAll(".grow");
    if(rows.length > 1) x.closest(".grow").remove();
    else x.closest(".grow").querySelectorAll("input").forEach(i => { i.value = ""; });
  }
}
function gridEnter(inp){
  const all = [...inp.closest(".gridf").querySelectorAll(".grow input")], i = all.indexOf(inp);
  if(i < all.length - 1) all[i + 1].focus();
  else gridAddRow(inp.closest(".gridf")).querySelector("input").focus();
}
function gridPaste(g, e){
  const text = (e.clipboardData || window.clipboardData).getData("text");
  if(!/[\t\n|]/.test(text.trim())) return;          // 한 칸짜리 붙여넣기는 그대로
  e.preventDefault();
  const lines = text.split(/\r?\n/).map(l => l.replace(/\s+$/, "")).filter(l => l.trim());
  const cur = e.target.closest(".grow"), col = GCOLS.findIndex(c => c.k === e.target.dataset.k);
  let row = cur;
  lines.forEach((ln, n) => {
    const cells = (ln.includes("\t") ? ln.split("\t") : ln.split("|")).map(x => x.trim());
    if(n > 0 || !row) row = (row && row.nextElementSibling) || gridAddRow(g);
    cells.forEach((v, k) => { const c = row.querySelectorAll("input")[col + k]; if(c) c.value = v; });
  });
}

/* ===== 구독 ===== */
function subscribe(){
  const mode = canEdit ? "all" : "public";
  if(subMode === mode) return;
  subMode = mode; if(unsub) unsub();
  const col = collection(db, COL);
  const q = mode === "all" ? col : query(col, where("status", "in", ["active", "archived"]));
  unsub = onSnapshot(q, { includeMetadataChanges:true }, snap => {
    lists.clear();
    snap.forEach(d => {
      const v = d.data({ serverTimestamps:"estimate" });
      lists.set(d.id, { ...v, id:d.id, sections:v.sections || [], checks:v.checks || {}, notes:v.notes || {} });
    });
    loaded = true;
    syncInfo = { ok:true, fromCache:snap.metadata.fromCache, pending:snap.metadata.hasPendingWrites, err:"" };
    renderSync(); render();
  }, err => {
    syncInfo = { ok:false, fromCache:false, pending:false, err:err.code || err.message };
    renderSync(); toast("불러오기 실패: " + syncInfo.err);
  });
}
function renderSync(){
  let txt;
  if(!CONFIGURED) txt = "미연결 (설정 필요)";
  else if(syncInfo.err) txt = "연결 오류";
  else if(!syncInfo.ok) txt = "연결 중…";
  else if(syncInfo.fromCache) txt = "오프라인 · 연결되면 자동 동기화";
  else if(syncInfo.pending) txt = "저장 중…";
  else txt = "실시간 연결됨";
  $("sync").textContent = txt; $("syncFoot").textContent = txt;
}

/* ===== 내보내기 ===== */
function rowsOf(l){
  const out = [["유형","구분","소분류","항목","수량","담당","상태","체크한 사람","체크 시각","메모"]];
  const nm = {};
  Object.values(l.notes || {}).sort((a, b) => (toD(a.at)?.getTime() || 0) - (toD(b.at)?.getTime() || 0))
    .forEach(n => { (nm[n.t] = nm[n.t] || []).push(`${n.byName || n.by || ""}: ${n.text.replace(/\s*\n\s*/g, " ")}`); });
  l.sections.forEach(s => s.groups.forEach(g => g.items.forEach(i => {
    const c = l.checks[i.id] || {};
    out.push([s.kind === "supply" ? "준비물" : "할 일", s.title + (s.date ? ` (${s.date})` : ""), g.name, i.text, i.qty || "", i.owner || "",
      c.checked ? "완료" : "", c.checked ? (c.byName || c.by || "") : "", c.checked ? fmt(c.at) : "", (nm[i.id] || []).join(" / ")]);
  })));
  rosterArr(l).forEach(r => out.push(["업무 분장", r.when || "", "", r.task, "", r.who || "", "", "", "", r.note || ""]));
  (nm["_p"] || []).forEach(t => out.push(["공유 메모", "", "", t, "", "", "", "", "", ""]));
  return out;
}
function stamp(){ return new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Seoul",dateStyle:"short",timeStyle:"short"}).format(new Date()).replace(/[-: ]/g,"").slice(0,12); }
function saveCSV(name, rows){
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], { type:"text/csv;charset=utf-8" }));
  a.download = name.replace(/[\\/:*?"<>|]/g,"") + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function exportCSV(l){ saveCSV(`${l.title}_${stamp()}`, rowsOf(l)); }
async function copyTSV(l){
  const tsv = rowsOf(l).map(r => r.map(c => String(c).replace(/[\t\r\n]+/g," ")).join("\t")).join("\n");
  try { await navigator.clipboard.writeText(tsv); toast("복사했어요. 구글 시트에 붙여넣기 하세요"); }
  catch(_){ toast("복사에 실패했어요. CSV 내려받기를 이용해 주세요"); }
}

  $("hSub").textContent = [l.dateText, l.status==="archived"?"보관됨":l.status==="trash"?"휴지통":""].filter(Boolean).join(" · ") || "진행 중";
  const { t, d } = stats(l);

  const canCheck = canEdit && l.status === "active";

  const notesBy = {};

  let html = "";

  if(l.status === "active" && CONFIGURED && !canEdit) html += `<div class="notice">체크하려면 등록된 직원 Google 계정으로 로그인하세요.</div>`;
  const sT = stats(l, "task"), sS = stats(l, "supply");
  const pn = notesBy["_p"] || [];
  html += `<div class="stick">`;
  if(pn.length || canCheck){
    const ln = pn[pn.length - 1];
    html += `<div class="pmemo"><div class="pm-h"><b>📌 공유 메모</b><button class="btn line sm" data-act="note-open" data-t="_p">${pn.length ? `전체 보기 (${pn.length})` : "＋ 메모 남기기"}</button></div>
      ${ln ? `<div class="pm-n"><b>${esc(ln.byName || ln.by || "")}</b><span>${esc(fmt(ln.at))}</span> ${esc(ln.text.replace(/\s*\n\s*/g, " "))}</div>` : ""}</div>`;
  }
  html += `<div class="tabs"><button class="tab ${ltab==="task"?"on":""}" data-act="ltab" data-k="task">할 일 ${sT.d}/${sT.t}</button>
    <button class="tab ${ltab==="supply"?"on":""}" data-act="ltab" data-k="supply">준비물 ${sS.d}/${sS.t}</button>
    <button class="tab ${ltab==="roster"?"on":""}" data-act="ltab" data-k="roster">업무 분장 ${Object.keys(l.roster || {}).length}</button></div>`;
  html += `<div class="tools">
    ${ltab !== "roster" ? `<button class="btn line" data-act="flt">${onlyOpen?"전체 보기":"미완료만 보기"}</button>
    <button class="btn line" data-act="fold">${closed.size ? "모두 펼치기" : "모두 접기"}</button>` : ""}
    <button class="btn line" data-act="csv">CSV 내려받기</button>
    <button class="btn line" data-act="tsv">구글 시트용 복사</button>
    ${canEdit && l.status==="active" && ltab !== "roster" ? `<button class="btn ${editing?"pri":"line"}" data-act="edit">${editing?"편집 끝내기":"✎ 편집"}</button>` : ""}
    ${canEdit && l.status!=="trash" ? `<button class="btn line" data-act="clone">복제</button><button class="btn line" data-act="save-tpl">템플릿으로 저장</button>` : ""}
    ${canEdit && l.status==="active" ? `<button class="btn line" data-act="archive" data-id="${l.id}">보관</button>` : ""}
    ${canEdit && l.status!=="trash" ? `<button class="btn dl" data-act="trash" data-id="${l.id}">삭제</button>` : ""}
  </div>`;
  if(editing) html += `<div class="tools"><button class="btn line sm" data-act="list-rename">이름·일정 수정</button></div>`;
  html += `</div>`;

  if(ltab === "roster"){ $("view").innerHTML = html + renderRoster(l, canCheck); return; }
  const ib = (act, label, attrs, cls = "") => `<button class="ib ${cls}" data-act="${act}" ${attrs} title="${esc(label)}">${label}</button>`;
  let shownSecs = 0;
  l.sections.forEach((s, si) => {
    if((s.kind || "task") !== ltab) return;
    shownSecs++;
    const isSup = ltab === "supply";
    const its = s.groups.flatMap(g => g.items);
    const done = its.filter(i => l.checks[i.id]?.checked).length, pct = its.length ? Math.round(done / its.length * 100) : 0;
    const sa = `data-s="${s.id}"`;
    let body = "", shown = 0;
    s.groups.forEach((g, gi) => {
      const ga = `${sa} data-g="${g.id}"`;
      const lis = g.items.filter(i => editing || !(onlyOpen && l.checks[i.id]?.checked)).map(i => {
        const c = l.checks[i.id] || {};
        const sup = isSup && (i.qty || i.owner) ? `<span class="sup">${i.qty?`<b>${esc(i.qty)}</b>`:""}${i.qty&&i.owner?" · ":""}${i.owner?`담당 ${esc(i.owner)}`:""}</span>` : "";
        const nl = notesBy[i.id] || [], last = nl[nl.length - 1];
        const memo = last ? `<span class="memo"><b>${esc(last.byName || last.by || "")}</b> ${esc(last.text.replace(/\s*\n\s*/g, " ").slice(0, 60))}${last.text.length > 60 ? "…" : ""}</span>` : "";
        const nb = (nl.length || canCheck) ? `<button class="note-btn ${nl.length ? "has" : ""}" data-act="note-open" data-t="${i.id}" title="메모">💬${nl.length ? " " + nl.length : ""}</button>` : "";
        const meta = c.checked ? `<span class="meta">✓ ${esc(c.byName || c.by || "")} · ${esc(fmt(c.at))}</span>` : "";
        if(editing) return `<li class="item edit ${c.checked?"done":""} ${sel.has(i.id)?"picked":""}"><input type="checkbox" class="st" disabled ${c.checked?"checked":""} aria-label="${c.checked?"체크됨":"체크 안 됨"}"><span class="txt"><span class="t">${esc(i.text)}</span>${sup}${meta}</span><span class="ctl"><input type="checkbox" class="item-sel" data-act="item-sel" data-i="${i.id}" ${sel.has(i.id)?"checked":""} aria-label="선택" title="선택">
          ${ib("item-up","↑",`${ga} data-i="${i.id}"`)}${ib("item-down","↓",`${ga} data-i="${i.id}"`)}${ib("item-edit","✎",`${ga} data-i="${i.id}"`)}${ib("item-del","✕",`${ga} data-i="${i.id}"`,"del")}</span></li>`;
        return `<li class="item ${c.checked?"done":""} ${canCheck?"":"lock"}" data-item="${i.id}"><label>
          <input type="checkbox" ${c.checked?"checked":""} ${canCheck?"":"tabindex=\"-1\""}>
          <span class="txt"><span class="t">${esc(i.text)}</span>${sup}${meta}${memo}</span></label>${nb}</li>`;
      });
      if(editing){
        const allSel = g.items.length && g.items.every(i => sel.has(i.id));
        body += `<div class="grp"><span class="nm">${esc(g.name || "(이름 없는 그룹)")}${g.items.length?`<label class="gsel"><input type="checkbox" data-act="grp-sel" ${ga} ${allSel?"checked":""}>전체</label>`:""}</span><span class="ctl">
          ${ib("grp-up","↑",ga)}${ib("grp-move","⇄",ga)}${ib("grp-down","↓",ga)}${ib("grp-edit","✎",ga)}${ib("grp-del","✕",ga,"del")}</span></div>
          <ul>${lis.join("")}</ul><div class="add-row">${ib("item-add","＋ 항목 추가",ga)}</div>`;
      } else if(lis.length){
        shown += lis.length;
        body += (g.name ? `<div class="grp"><span class="nm">${esc(g.name)}</span></div>` : "") + `<ul>${lis.join("")}</ul>`;
      }
    });
    if(!editing && !shown) body = `<div class="empty" style="padding:14px">${onlyOpen && its.length ? "남은 항목이 없어요 🎉" : "항목이 없어요"}</div>`;
    if(editing) body += `<div class="add-row">${ib("grp-add","＋ 소분류 추가",sa)}</div>`;
    const ctl = editing ? `<span class="ctl">${ib("sec-up","↑",sa)}${ib("sec-down","↓",sa)}${ib("sec-edit","✎",sa)}${ib("sec-del","✕",sa,"del")}</span>` : "";
    html += `<section class="sec ${closed.has(s.id)?"closed":""}" data-sec="${s.id}">
      <div class="sec-h" data-act="sec-fold" ${sa}><span class="chev">▼</span>
        <h2>${esc(s.title)}${s.date?`<span>${esc(s.date)}</span>`:""}</h2>${ctl}<span class="cnt">${done} / ${its.length}</span></div>
      <div class="sec-bar"><i style="width:${pct}%"></i></div>
      <div class="sec-b">${s.note?`<p class="sec-note">${esc(s.note)}</p>`:""}${body}</div></section>`;
  });
  if(editing) html += `<div class="add-row" style="padding:0">${ib("sec-add", ltab==="supply" ? "＋ 준비물 구분 추가" : "＋ 구분(섹션) 추가", "")}</div>`;
  if(!shownSecs && !editing){
    html += ltab === "supply"
      ? `<div class="empty">이 프로젝트에는 준비물 목록이 아직 없어요.${canCheck?`<br><br><button class="btn pri" data-act="supply-init">＋ 준비물 목록 만들기</button>`:""}</div>`
      : `<div class="empty">항목이 없어요.</div>`;
  }
  $("view").innerHTML = html;
  renderSel(l, editing);
}
function renderSel(l, editing){
  const ids = new Set(); if(l) l.sections.forEach(s => s.groups.forEach(g => g.items.forEach(i => ids.add(i.id))));
  [...sel].forEach(x => { if(!ids.has(x)) sel.delete(x); });
  const bar = $("selBar");
  bar.classList.toggle("on", !!(editing && sel.size));
  $("selCnt").textContent = `${sel.size}개 선택됨`;
}

/* ===== 메모 ===== */
function notesOf(l, target){
  return Object.entries(l.notes || {}).filter(([, n]) => n.t === target).map(([id, n]) => ({ id, ...n }))
    .sort((a, b) => (toD(a.at)?.getTime() || 0) - (toD(b.at)?.getTime() || 0));
}
function noteTitle(l, t){
  if(t === "_p") return "📌 공유 메모";
  for(const s of l.sections) for(const g of s.groups) for(const i of g.items) if(i.id === t) return "💬 " + i.text;
  return "💬 메모";
}
function openNotes(target){
  const l = lists.get(route.id); if(!l) return;
  noteT = target; noteEdit = null; $("nText").value = "";
  if(!$("ndlg").open) $("ndlg").showModal();
  renderNotes();
}
function renderNotes(){
  if(!noteT || !$("ndlg").open) return;
  const l = lists.get(route.id); if(!l){ $("ndlg").close(); return; }
  const canWrite = canEdit && l.status === "active";
  const me = user ? user.email.toLowerCase() : "";
  $("nTitle").textContent = noteTitle(l, noteT);
  const ns = notesOf(l, noteT);
  $("nList").innerHTML = ns.length ? ns.map(n => {
    const mine = canWrite && (n.by === me || isAdmin);
    return `<div class="nt"><div class="nt-h"><b>${esc(n.byName || n.by || "")}</b><span>${esc(fmt(n.at))}${n.edited ? " · 수정됨" : ""}</span></div>
      <div class="nt-b">${esc(n.text)}</div>${mine ? `<div class="nt-a"><button class="btn line sm" data-nact="edit" data-n="${n.id}">수정</button><button class="btn dl sm" data-nact="del" data-n="${n.id}">삭제</button></div>` : ""}</div>`;
  }).join("") : `<div class="empty" style="padding:14px">아직 메모가 없어요.</div>`;
  $("nForm").style.display = canWrite ? "" : "none";
  $("nReadOnly").style.display = canWrite ? "none" : "flex";
  $("nSave").textContent = noteEdit ? "수정 저장" : "메모 남기기";
  $("nCancelEdit").style.display = noteEdit ? "" : "none";
  $("nList").scrollTop = $("nList").scrollHeight;
}
function addNote(listId, target, text){
  if(!guard(true, listId)) return;
  updateDoc(ref(listId), { ["notes." + uid("n")]: { t:target, text, ...who(), at:serverTimestamp() }, updatedAt:serverTimestamp() }).catch(fail);
}
$("nSave").onclick = () => {
  const text = $("nText").value.trim(); if(!text){ toast("내용을 입력해 주세요"); return; }
  const l = lists.get(route.id); if(!l) return;
  if(noteEdit){
    if(guard(true, l.id)) updateDoc(ref(l.id), { ["notes." + noteEdit + ".text"]: text, ["notes." + noteEdit + ".edited"]: true, updatedAt:serverTimestamp() }).catch(fail);
    noteEdit = null;
  } else addNote(l.id, noteT, text);
  $("nText").value = ""; renderNotes();
};
$("nCancelEdit").onclick = () => { noteEdit = null; $("nText").value = ""; renderNotes(); };
const closeNotes = () => { if($("ndlg").open) $("ndlg").close(); };
$("nClose").onclick = closeNotes; $("nClose2").onclick = closeNotes;
$("ndlg").onclose = () => { noteT = null; noteEdit = null; };
$("nList").addEventListener("click", async e => {

/* ===== 업무 분장 (담당자별 업무표) ===== */
const whoList = s => String(s || "").split(/[,，、]/).map(x => x.trim()).filter(Boolean);
const rosterArr = l => Object.entries(l.roster || {}).map(([id, r]) => ({ id, ...r })).sort((a, b) => (a.ord || 0) - (b.ord || 0));
const cleanRoster = arr => (arr || []).map(r => ({ task:r.task || "", who:r.who || "", when:r.when || "", note:r.note || "" }));
const rosterMap = arr => { const o = {}; cleanRoster(arr).forEach((r, i) => { o[uid("r")] = { ...r, ord:Date.now() + i }; }); return o; };
let rosterView = "who";   // "who": 담당자별 묶음 / "order": 입력 순서
function renderRoster(l, canCheck){
  const rows = rosterArr(l);
  const head = `<div class="r-tools"><div class="seg"><button type="button" class="seg-b ${rosterView==="who"?"on":""}" data-act="rview" data-k="who">담당자별</button><button type="button" class="seg-b ${rosterView==="order"?"on":""}" data-act="rview" data-k="order">입력 순서</button></div>${canCheck ? `<button type="button" class="btn pri sm" data-act="r-add">＋ 업무 추가</button>` : ""}</div>`;
  if(!rows.length) return head + `<div class="empty">아직 업무 분장이 없어요.${canCheck ? "<br>‘＋ 업무 추가’로 담당자와 맡은 일을 적어 보세요." : ""}</div>`;
  const ctl = r => canCheck ? `<span class="ctl"><button type="button" class="ib" data-act="r-edit" data-r="${r.id}" title="수정">✎</button><button type="button" class="ib del" data-act="r-del" data-r="${r.id}" title="삭제">✕</button></span>` : "";
  const card = (r, showWho, showKey = "") => `<div class="rr"><div class="rr-main">${showWho ? `<span class="rr-who">${esc(whoList(r.who).join(" · ") || "미정")}</span>` : ""}<span class="rr-task">${esc(r.task)}</span>${!showWho && whoList(r.who).length > 1 ? `<span class="rr-with">👥 함께: ${esc(whoList(r.who).filter(n => n !== showKey).join(", "))}</span>` : ""}${r.when ? `<span class="rr-when">🕘 ${esc(r.when)}</span>` : ""}${r.note ? `<span class="rr-note">${esc(r.note)}</span>` : ""}</div>${ctl(r)}</div>`;
  if(rosterView === "order") return head + `<section class="sec"><div class="sec-b">${rows.map(r => card(r, true)).join("")}</div></section>`;
  const order = [], by = new Map();
  rows.forEach(r => { (whoList(r.who).length ? whoList(r.who) : ["미정"]).forEach(k => { if(!by.has(k)){ by.set(k, []); order.push(k); } by.get(k).push(r); }); });
  order.sort((a, b) => (a === "미정") - (b === "미정"));
  return head + order.map(k => `<section class="sec"><div class="sec-h" style="cursor:default"><h2>${esc(k)}</h2><span class="cnt">${by.get(k).length}건</span></div><div class="sec-b">${by.get(k).map(r => card(r, false, k)).join("")}</div></section>`).join("");
}
async function editRoster(l, r){
  if(!guard(true, l.id)) return;
  const names = [...new Set(staffRows.map(x => String(x.name || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const curList = r ? whoList(r.who) : [], picked = curList.filter(n => names.includes(n)), extra = curList.filter(n => !names.includes(n));
  const v = await openForm({ title:r ? "업무 수정" : "업무 추가", ok:"저장",
    fields:[
      { key:"task", label:"맡은 일", required:true, value:r ? r.task : "", placeholder:"예) 5.0초 게임 진행" },
      { key:"picks", type:"checks", label:"담당자 (여러 명 선택 가능 · 비우면 미정)", options:names, value:picked },
      { key:"custom", label:"목록에 없는 담당자 (여러 명이면 쉼표로)", value:extra.join(", "), placeholder:"예) 홍길동, 협력사 직원" },
      { key:"when", label:"시간·장소 (선택)", value:r ? (r.when || "") : "", placeholder:"예) 11/18 10:00~12:00 · 1층 로비" },
      { key:"note", label:"비고 (선택)", value:r ? (r.note || "") : "", hint:"전화번호 같은 개인정보는 적지 마세요. 로그인 없이도 볼 수 있는 화면이에요." }
    ]
  });
  if(v === null) return;
  const task = v.task.trim(); if(!task){ toast("맡은 일을 입력해 주세요"); return; }
  const whoName = [...new Set([...v.picks, ...whoList(v.custom)])].join(", ");
  const id = r ? r.id : uid("r");
  const row = { who:whoName, task, when:v.when.trim(), note:v.note.trim(), ord:r ? (r.ord || 0) : Date.now() };
  if(guard(true, l.id)) updateDoc(ref(l.id), { ["roster." + id]: row, updatedAt:serverTimestamp() }).catch(fail);
}
async function delRoster(l, r){
  if(!guard(true, l.id) || !r) return;
  if(await confirmBox("업무 삭제", `‘${r.task}’ 업무를 삭제할까요?`, "삭제"))
    updateDoc(ref(l.id), { ["roster." + r.id]: deleteField(), updatedAt:serverTimestamp() }).catch(fail);
}

/* ===== 템플릿 (저장·편집·CSV) ===== */
let templates = new Map(), tplUnsub = null, tplErr = "";
const OUTLINE_PH = "# 사전 준비\n@일정 11/16 ~ 11/17\n## 장비\n- 사이니지 점검\n# [준비물] 휴대 물품\n## 소모품\n- 인화용지 | 200장 | 김팀장";
const OUTLINE_HINT = "# 구분   ## 소분류   - 항목\n@일정 …   @안내 …  (구분 바로 아래 줄, 선택)\n# [준비물] 구분 → 준비물 탭, 항목은 “이름 | 수량 | 담당”\n# [분장] 업무 분장 → 업무 분장 탭, 줄은 “업무 | 담당자 | 시간·장소 | 비고”";
const reid = secs => secs.map(s => ({ id:uid("s"), title:s.title, kind:s.kind || "task", date:s.date || "", note:s.note || "",
  groups:(s.groups || []).map(g => ({ id:uid("g"), name:g.name || "",
    items:(g.items || []).map(i => ({ id:uid("i"), text:i.text, ...(i.qty ? { qty:i.qty } : {}), ...(i.owner ? { owner:i.owner } : {}) })) })) }));
const countSecs = secs => ({ s:secs.length, i:secs.reduce((n, s) => n + s.groups.reduce((m, g) => m + g.items.length, 0), 0) });
function toOutline(secs, roster = []){
  const out = [];
  secs.forEach(s => {
    out.push("# " + (s.kind === "supply" ? "[준비물] " : "") + s.title);
    if(s.date) out.push("@일정 " + s.date);
    if(s.note) out.push("@안내 " + String(s.note).replace(/\s*\n\s*/g, " "));
    s.groups.forEach((g, gi) => {
      if(g.name) out.push("## " + g.name); else if(gi > 0) out.push("## 기타");
      g.items.forEach(i => out.push("- " + (s.kind === "supply" ? [i.text, i.qty || "", i.owner || ""].join(" | ").replace(/(\s*\|\s*)+$/, "") : i.text)));
    });
  });
  if(roster && roster.length){
    out.push("# [분장] 업무 분장");
    cleanRoster(roster).forEach(r => out.push("- " + [r.task, r.who, r.when, r.note].join(" | ").replace(/(\s*\|\s*)+$/, "")));
  }
  return out.join("\n");
}
function parseCSV(text){
  text = String(text).replace(/^\uFEFF/, "");
  const first = text.split(/\r?\n/, 1)[0] || "";
  const d = (first.includes("\t") && !first.includes(",")) ? "\t" : ",";
  const rows = []; let row = [], cur = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){ if(c === '"'){ if(text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"' && cur === "") q = true;
    else if(c === d){ row.push(cur); cur = ""; }
    else if(c === "\n" || c === "\r"){ if(c === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; rows.push(row); row = []; }
    else cur += c;
  }
  if(cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}
/* CSV → 구성. 필요한 열: 항목 (그 외 유형·구분·소분류·수량·담당·일정·안내는 선택). 없으면 null */
function csvToSections(text){
  const rows = parseCSV(text); if(!rows.length) return [];
  const head = rows[0].map(h => String(h).trim());
  const ix = n => head.indexOf(n), iI = ix("항목"); if(iI < 0) return null;
  const iT = ix("유형"), iS = ix("구분"), iG = ix("소분류"), iQ = ix("수량"), iO = ix("담당"), iD = ix("일정"), iN = ix("안내"), iM = ix("메모");
  const get = (r, i) => i < 0 ? "" : String(r[i] ?? "").trim();
  const secs = [], byKey = new Map(), roster = [];
  for(const r of rows.slice(1)){
    const typ = get(r, iT), txt = get(r, iI);
    if(!txt || typ === "공유 메모") continue;
    if(/분장/.test(typ)){ roster.push({ task:txt, who:get(r, iO), when:get(r, iS), note:get(r, iN) || get(r, iM) }); continue; }
    const kind = /준비물|supply/i.test(typ) ? "supply" : "task";
    let title = get(r, iS) || (kind === "supply" ? "준비물" : "체크리스트"), date = get(r, iD);
    const m = title.match(/\s*\(([\d.\/~\-\s]+)\)\s*$/);          // 내보낸 CSV의 “구분 (일정)” 모양
    if(m){ title = title.slice(0, m.index).trim() || title; if(!date) date = m[1].trim(); }
    const key = kind + "\u0001" + title;
    let sec = byKey.get(key);
    if(!sec){ sec = { id:uid("s"), title, kind, date:"", note:"", groups:[] }; byKey.set(key, sec); secs.push(sec); }
    if(!sec.date && date) sec.date = date;
    const note = get(r, iN); if(!sec.note && note) sec.note = note;
    const gname = get(r, iG);
    let grp = sec.groups.find(g => g.name === gname);
    if(!grp){ grp = { id:uid("g"), name:gname, items:[] }; sec.groups.push(grp); }
    const qty = get(r, iQ), owner = get(r, iO);
    grp.items.push({ id:uid("i"), text:txt, ...(kind === "supply" && qty ? { qty } : {}), ...(kind === "supply" && owner ? { owner } : {}) });
  }
  secs.roster = roster;
  return secs;
}
function tplRows(t){
  const out = [["유형", "구분", "소분류", "항목", "수량", "담당", "일정", "안내"]];
  t.sections.forEach(s => { let first = true;
    s.groups.forEach(g => g.items.forEach(i => {
      out.push([s.kind === "supply" ? "준비물" : "할 일", s.title, g.name, i.text, i.qty || "", i.owner || "", first ? (s.date || "") : "", first ? (s.note || "") : ""]);
      first = false;
    }));
  });
  cleanRoster(t.roster).forEach(r => out.push(["업무 분장", r.when, "", r.task, "", r.who, "", r.note]));
  return out;
}

    ],

      f.querySelector("input").onchange = async e => {

}

    case "empty-trash": return emptyTrash();
    case "flt": onlyOpen = !onlyOpen; return render();
    case "fold": if(closed.size) closed.clear(); else l.sections.forEach(s => closed.add(s.id)); return render();
    case "csv": return l && exportCSV(l);
    case "tsv": return l && copyTSV(l);
    case "edit": editMode = !editMode; sel.clear(); return render();
    case "clone": return cloneList(route.id);
    case "sec-fold": closed.has(S) ? closed.delete(S) : closed.add(S); return render();
    case "list-rename": {
      const v = await openForm({ title:"이름·일정 수정", fields:[{ key:"title", label:"이름", value:l.title, required:true }, { key:"dateText", label:"행사 일정", value:l.dateText || "" }] });
      if(v && v.title.trim() && guard(true, l.id)) updateDoc(ref(l.id), { title:v.title.trim(), dateText:v.dateText.trim(), updatedAt:serverTimestamp() }).catch(fail);
      return;
    }
    case "sec-add": {
      const kind = ltab;
      const v = await openForm({ title: kind === "supply" ? "준비물 구분 추가" : "구분(섹션) 추가", fields:[{ key:"title", label:"구분 이름", required:true, placeholder: kind === "supply" ? "예) 장비 / 소모품" : "예) 7. 정산" }, { key:"date", label:"일정 (선택)" }] });
      if(v && v.title.trim()) mutate(l.id, secs => { secs.push({ id:uid("s"), title:v.title.trim(), kind, date:v.date.trim(), note:"", groups:[{ id:uid("g"), name:"", items:[] }] }); });
      return;
    }
    case "sec-edit": {
      const s = findSec(l.sections, S);
      const v = await openForm({ title:"구분 수정", fields:[{ key:"title", label:"구분 이름", value:s.title, required:true }, { key:"date", label:"일정 (선택)", value:s.date || "" }, { key:"note", label:"설명 (선택)", type:"textarea", value:s.note || "" }] });
      if(v && v.title.trim()) mutate(l.id, secs => { const x = findSec(secs, S); x.title = v.title.trim(); x.date = v.date.trim(); x.note = v.note.trim(); });
      return;
    }
    case "sec-up": case "sec-down": return mutate(l.id, secs => move(secs, secs.findIndex(s => s.id === S), act === "sec-up" ? -1 : 1));
    case "sec-del": {
      const s = findSec(l.sections, S);
      if(await confirmBox("구분 삭제", `‘${s.title}’과(와) 안의 항목을 모두 삭제할까요?`, "삭제")) mutate(l.id, secs => { secs.splice(secs.findIndex(x => x.id === S), 1); });
      return;
    }
    case "grp-add": {
      const v = await openForm({ title:"소분류 추가", fields:[{ key:"name", label:"소분류 이름", required:true, placeholder:"예) 장비" }] });
      if(v && v.name.trim()) mutate(l.id, secs => { findSec(secs, S).groups.push({ id:uid("g"), name:v.name.trim(), items:[] }); });
      return;
    }
    case "grp-edit": {
      const g = findGrp(l.sections, S, G);
      const v = await openForm({ title:"소분류 이름 수정", fields:[{ key:"name", label:"소분류 이름 (비우면 헤더 없음)", value:g.name }] });
      if(v) mutate(l.id, secs => { findGrp(secs, S, G).name = v.name.trim(); });
      return;
    }
    case "grp-up": case "grp-down": return mutate(l.id, secs => { const gs = findSec(secs, S).groups; return move(gs, gs.findIndex(g => g.id === G), act === "grp-up" ? -1 : 1); });
    case "grp-del": {
      const g = findGrp(l.sections, S, G);
      if(await confirmBox("소분류 삭제", `‘${g.name || "이름 없는 그룹"}’과(와) 안의 항목 ${g.items.length}개를 삭제할까요?`, "삭제")) mutate(l.id, secs => { const gs = findSec(secs, S).groups; gs.splice(gs.findIndex(x => x.id === G), 1); });
      return;
    }
    case "item-add": {
      const sup = findSec(l.sections, S).kind === "supply";
      const v = await openForm({ title: sup ? "준비물 추가" : "항목 추가", ok:"추가",
        fields: sup
          ? [{ key:"rows", type:"grid", label:"준비물 (칸에 나눠 입력 · 수량·담당은 비워도 돼요)", rows:4,
               hint:"Enter로 다음 칸 · 마지막 칸에서 Enter 하면 새 줄이 생겨요.\n엑셀·구글 시트에서 복사해 첫 칸에 붙여넣으면 한 번에 채워져요." }]
          : [{ key:"text", label:"항목 (여러 줄이면 한 줄에 하나씩)", type:"textarea" }] });
      if(v){
        const items = sup
          ? v.rows.filter(r => r.name).map(r => ({ id:uid("i"), text:r.name, ...(r.qty ? { qty:r.qty } : {}), ...(r.owner ? { owner:r.owner } : {}) }))
          : v.text.split(/\r?\n/).map(x => x.trim()).filter(Boolean).map(t => ({ id:uid("i"), text:t }));
        if(sup && v.rows.some(r => !r.name)) toast("이름이 빈 줄은 건너뛰었어요");
        if(items.length) mutate(l.id, secs => { findGrp(secs, S, G).items.push(...items); });
      }
      return;
    }
    case "item-edit": {
      const sup = findSec(l.sections, S).kind === "supply";
      const it = findGrp(l.sections, S, G).items.find(x => x.id === I);
      const fields = [{ key:"text", label: sup ? "준비물" : "항목", type:"textarea", value:it.text }];
      if(sup) fields.push({ key:"qty", label:"수량 (선택)", value:it.qty || "", placeholder:"예) 35세트" }, { key:"owner", label:"담당 (선택)", value:it.owner || "" });
      const v = await openForm({ title: sup ? "준비물 수정" : "항목 수정", fields });
      if(v && v.text.trim()) mutate(l.id, secs => {
        const x = findGrp(secs, S, G).items.find(y => y.id === I);
        x.text = v.text.trim().replace(/\s*\n\s*/g, " ");
        if(sup){ const q = (v.qty || "").trim(), o = (v.owner || "").trim(); if(q) x.qty = q; else delete x.qty; if(o) x.owner = o; else delete x.owner; }
      });
      return;
    }
    case "item-up": case "item-down": return mutate(l.id, secs => { const its = findGrp(secs, S, G).items; return move(its, its.findIndex(x => x.id === I), act === "item-up" ? -1 : 1); });
    case "item-sel": { if(sel.has(I)) sel.delete(I); else sel.add(I); return render(); }
    case "grp-sel": {
      const g = findGrp(l.sections, S, G), all = g.items.every(i => sel.has(i.id));
      g.items.forEach(i => all ? sel.delete(i.id) : sel.add(i.id)); return render();
    }
    case "sel-clear": sel.clear(); return render();
    case "sel-del": {
      const ids = new Set(sel); if(!ids.size) return;
      if(await confirmBox("선택 항목 삭제", `선택한 ${ids.size}개 항목을 삭제할까요?\n(되돌릴 수 없어요)`, `${ids.size}개 삭제`)){
        sel.clear();
        mutate(l.id, secs => { secs.forEach(s => s.groups.forEach(g => { g.items = g.items.filter(i => !ids.has(i.id)); })); });
      }
      return;
    }
    case "sel-move": {
      const ids = new Set(sel); if(!ids.size) return;
      const opts = [];
      l.sections.forEach(s => { if((s.kind || "task") !== ltab) return; s.groups.forEach(g => opts.push({ value:s.id + "|" + g.id, label:`${s.title}${g.name ? " › " + g.name : ""}` })); });
      if(!opts.length){ toast("옮길 소분류가 없어요"); return; }
      const v = await openForm({ title:`${ids.size}개 항목 이동`, ok:"이동",
        message:"체크 기록과 메모는 그대로 따라가요.",
        fields:[{ key:"to", label:"옮길 곳 (구분 › 소분류)", type:"select", options:opts },
                { key:"pos", label:"위치", type:"select", value:"end", options:[{ value:"end", label:"맨 뒤에 붙이기" }, { value:"start", label:"맨 앞에 넣기" }] }] });
      if(v){
        const [ts, tg] = v.to.split("|");
        sel.clear();
        mutate(l.id, secs => {
          const dest = findGrp(secs, ts, tg); if(!dest) return false;
          const moved = [];
          secs.forEach(s => s.groups.forEach(g => { g.items = g.items.filter(i => { if(ids.has(i.id)){ moved.push(i); return false; } return true; }); }));
          if(v.pos === "start") dest.items.unshift(...moved); else dest.items.push(...moved);
        });
        toast(`${ids.size}개 항목을 옮겼어요`);
      }
      return;
    }
    case "grp-move": {
      const g0 = findGrp(l.sections, S, G), kind = findSec(l.sections, S).kind || "task";
      const opts = l.sections.filter(s => (s.kind || "task") === kind && s.id !== S).map(s => ({ value:s.id, label:s.title }));
      if(!opts.length){ toast("옮길 다른 구분이 없어요"); return; }
      const v = await openForm({ title:`‘${g0.name || "이름 없는 그룹"}’ 소분류 이동`, ok:"이동", message:"항목과 체크 기록이 함께 옮겨져요.",
        fields:[{ key:"to", label:"옮길 구분", type:"select", options:opts }] });
      if(v) mutate(l.id, secs => {
        const from = findSec(secs, S), to = findSec(secs, v.to); if(!to) return false;
        const k = from.groups.findIndex(x => x.id === G); to.groups.push(...from.groups.splice(k, 1));
      });
      return;
    }
    case "item-del": {
      const it = findGrp(l.sections, S, G).items.find(x => x.id === I);
      if(await confirmBox("항목 삭제", `‘${it.text}’을(를) 삭제할까요?`, "삭제")) mutate(l.id, secs => { const its = findGrp(secs, S, G).items; its.splice(its.findIndex(x => x.id === I), 1); });
      return;
    }
  }
}

$("selBar").addEventListener("click", e => { const a = e.target.closest("[data-act]"); if(a) handleAct(a); });
$("view").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if(a){ e.preventDefault(); handleAct(a); return; }
  const li = e.target.closest("li.item[data-item]");
  if(li){
    e.preventDefault();
    if(!CONFIGURED){ toast("Firebase 설정 후 사용할 수 있어요"); return; }
    const l = lists.get(route.id);
    if(l && l.status !== "active"){ toast(l.status === "archived" ? "보관된 체크리스트는 수정할 수 없어요" : "휴지통의 체크리스트예요"); return; }
    toggleItem(route.id, li.dataset.item); return;
  }
  const c = e.target.closest("[data-open]");
  if(c) location.hash = "#/c/" + c.dataset.open;
});

/* 상단 고정 영역(헤더) 높이를 CSS 변수로 알려 줘서 그 아래에 탭·도구가 붙도록 */
const syncHH = () => { const h = document.querySelector("header"); if(h) document.documentElement.style.setProperty("--hh", h.offsetHeight + "px"); };
window.addEventListener("resize", syncHH);
if(window.ResizeObserver) new ResizeObserver(syncHH).observe(document.querySelector("header"));
syncHH();

/* ===== 시작 ===== */
renderSync();
if(!CONFIGURED){
  lists.set("demo", { id:"demo", title:"2026 AX 농업포럼 체험 부스 (미리보기)", dateText:"2026.11.18~20", status:"active", sections:buildSections(TEMPLATE_AX), checks:{} });
  loaded = true;
  readRoute();
} else {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  getRedirectResult(auth).catch(() => {});
  readRoute();
  subscribe();
  onAuthStateChanged(auth, async u => {
    user = (u && !u.isAnonymous && u.email) ? u : null;
    if(user){ const r = await checkStaff(user); canEdit = r.ok; isAdmin = r.ok && r.admin; staffName = r.ok ? (r.name || "") : ""; }
    else { canEdit = false; isAdmin = false; staffName = ""; }
    subscribe(); subscribeTpl(); subscribeStaffList(); render();
  });
}
</script>
